<rect x="20" y="46" width="680" height="42" fill="none" stroke="#000" stroke-width="1.9"/>
<text x="55" y="72" font-size="12" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">国</text>
<text x="162.5" y="64.5" font-size="12" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">一人当たりGNI</text>
<text x="162.5" y="79.5" font-size="12" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">（ドル）</text>
<text x="310" y="64.5" font-size="12" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">就業者に占める</text>
<text x="310" y="79.5" font-size="12" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">第一次産業の割合(%)</text>
<text x="542.5" y="72" font-size="12" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">国土や資源のようす</text>
<rect x="20" y="88" width="680" height="42" fill="none" stroke="#000" stroke-width="1.36"/>
<text x="55" y="114" font-size="13" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">A国</text>
<text x="162.5" y="114" font-size="13" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">78,000</text>
<text x="310" y="114" font-size="13" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">2</text>
<text x="397" y="114" font-size="12" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">起伏が大きく、年降水量が多い</text>
<rect x="20" y="130" width="680" height="42" fill="none" stroke="#000" stroke-width="1.36"/>
<text x="55" y="156" font-size="13" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">B国</text>
<text x="162.5" y="156" font-size="13" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">42,000</text>
<text x="310" y="156" font-size="13" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">3</text>
<text x="397" y="156" font-size="12" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">石炭・石油・天然ガスにとぼしい</text>
<rect x="20" y="172" width="680" height="42" fill="none" stroke="#000" stroke-width="1.36"/>
<text x="55" y="198" font-size="13" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">C国</text>
<text x="162.5" y="198" font-size="13" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">25,000</text>
<text x="310" y="198" font-size="13" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">2</text>
<text x="397" y="198" font-size="12" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">国土の大半が砂漠。原油の輸出が経済の中心</text>
<rect x="20" y="214" width="680" height="42" fill="none" stroke="#000" stroke-width="1.36"/>
<text x="55" y="240" font-size="13" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">D国</text>
<text x="162.5" y="240" font-size="13" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">2,400</text>
<text x="310" y="240" font-size="13" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">38</text>
<text x="397" y="240" font-size="12" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">石炭を産出する。人口の多くが農村部に住む</text>
<path d="M90 46 L90 256" stroke="#000" stroke-width="1.36" fill="none"/>
<path d="M235 46 L235 256" stroke="#000" stroke-width="1.36" fill="none"/>
<path d="M385 46 L385 256" stroke="#000" stroke-width="1.36" fill="none"/>
<text x="20" y="282" font-size="11" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">※ 訓練用に作成した架空の国と数値であり、実在の国ではない。</text>
