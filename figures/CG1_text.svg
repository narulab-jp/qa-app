<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" role="img" aria-label="資料2　架空大陸の4地点のようす"><defs>
 <pattern id="pDiag" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><path d="M0 8 L8 0" stroke="#000" stroke-width="1.4"/></pattern>
 <pattern id="pDiag2" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><path d="M0 0 L8 8" stroke="#000" stroke-width="1.4"/></pattern>
 <pattern id="pDot" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><circle cx="2" cy="2" r="1.3" fill="#000"/>
  <circle cx="6" cy="6" r="1.3" fill="#000"/></pattern>
 <pattern id="pDotFine" width="5" height="5" patternUnits="userSpaceOnUse">
  <rect width="5" height="5" fill="#fff"/><circle cx="1.4" cy="1.4" r="0.9" fill="#000"/></pattern>
 <pattern id="pGrid" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/>
  <path d="M0 4 H8 M4 0 V8" stroke="#000" stroke-width="0.9"/></pattern>
 <pattern id="pWave" width="10" height="8" patternUnits="userSpaceOnUse">
  <rect width="10" height="8" fill="#fff"/>
  <path d="M0 5 q2.5 -3 5 0 t5 0" stroke="#000" stroke-width="0.9" fill="none"/></pattern>
</defs><rect width="720" height="332" fill="#fff"/>
<text x="20" y="28" font-size="16" text-anchor="start" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">資料2　架空大陸の4地点のようす</text>
<rect x="20" y="44" width="680" height="254" fill="none" stroke="#000" stroke-width="1"/>
<text x="38" y="74" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">ア　一年を通じて気温が低く、針葉樹の林が広がる。冬は地面が凍り、農業はほとん</text>
<text x="38" y="100" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">ど行われない。</text>
<text x="38" y="126" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000"></text>
<text x="38" y="152" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">ウ　一年中雨が少なく、川の水にたよったかんがい農業と、らくだを使った移動がみ</text>
<text x="38" y="178" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">られる。</text>
<text x="38" y="204" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000"></text>
<text x="38" y="230" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">カ　雨季と乾季がはっきりしており、丈の高い草原に樹木が点在する。</text>
<text x="38" y="256" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000"></text>
<text x="38" y="282" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">ク　一年中高温で雨が多く、背の高い常緑の森林におおわれている。</text>
<text x="20" y="320" font-size="11" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">※ 訓練用に作成した模式地形図であり、実在の地域ではない。</text>
</svg>
