<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" role="img" aria-label="資料2　内陸国Jとまわりの国のようす"><defs>
 <pattern id="pDiag" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><path d="M0 8 L8 0" stroke="#000" stroke-width="1.9"/></pattern>
 <pattern id="pDiag2" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><path d="M0 0 L8 8" stroke="#000" stroke-width="1.9"/></pattern>
 <pattern id="pDot" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><circle cx="2" cy="2" r="1.3" fill="#000"/>
  <circle cx="6" cy="6" r="1.3" fill="#000"/></pattern>
 <pattern id="pDotFine" width="5" height="5" patternUnits="userSpaceOnUse">
  <rect width="5" height="5" fill="#fff"/><circle cx="1.4" cy="1.4" r="0.9" fill="#000"/></pattern>
 <pattern id="pGrid" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/>
  <path d="M0 4 H8 M4 0 V8" stroke="#000" stroke-width="1.23"/></pattern>
 <pattern id="pWave" width="10" height="8" patternUnits="userSpaceOnUse">
  <rect width="10" height="8" fill="#fff"/>
  <path d="M0 5 q2.5 -3 5 0 t5 0" stroke="#000" stroke-width="1.23" fill="none"/></pattern>
</defs><rect width="720" height="306" fill="#fff"/>
<text x="20" y="28" font-size="16" text-anchor="start" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">資料2　内陸国Jとまわりの国のようす</text>
<rect x="20" y="44" width="680" height="228" fill="none" stroke="#000" stroke-width="1.36"/>
<text x="38" y="74" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">J国から港までの鉄道は、M国を通っている。K国には舗装された道路がなく、</text>
<text x="38" y="100" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">L国との間には標高3,000mを超える山脈がある。</text>
<text x="38" y="126" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000"></text>
<text x="38" y="152" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">J国の輸出額の内訳は、銅71％、コバルト12％、木材7％、その他10％である</text>
<text x="38" y="178" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">。</text>
<text x="38" y="204" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000"></text>
<text x="38" y="230" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">銅の国際価格の指数（2016年＝100）は、2016年62、2018年88、</text>
<text x="38" y="256" font-size="14" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">2020年71、2022年104、2024年58。</text>
<text x="20" y="294" font-size="11" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">※ 訓練用に作成した架空の数値であり、実在の地点・国ではない。</text>
</svg>
