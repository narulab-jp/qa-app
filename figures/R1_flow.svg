  <path d="M0 5 q2.5 -3 5 0 t5 0" stroke="#000" stroke-width="1.23" fill="none"/></pattern>
</defs><rect width="720" height="300" fill="#fff"/>
<text x="20" y="26" font-size="15" text-anchor="start" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">図1　地域調査の流れ</text>
<rect x="24" y="70" width="126" height="74" fill="none" stroke="#000" stroke-width="1.63"/><text x="87" y="102.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">問いを決める</text><text x="87" y="118.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">何を知りたいか</text>
<path d="M150 107 L154 107" stroke="#000" stroke-width="1.9" fill="none"/><polygon points="162,107 152,102 152,112" fill="#000" stroke="#000" stroke-width="1.09"/>
<rect x="162" y="70" width="126" height="74" fill="none" stroke="#000" stroke-width="1.63"/><text x="225" y="102.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">仮説を立てる</text><text x="225" y="118.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">たぶんこうだ</text>
<path d="M288 107 L292 107" stroke="#000" stroke-width="1.9" fill="none"/><polygon points="300,107 290,102 290,112" fill="#000" stroke="#000" stroke-width="1.09"/>
<rect x="300" y="70" width="126" height="74" fill="none" stroke="#000" stroke-width="1.63"/><text x="363" y="102.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">資料を集める</text><text x="363" y="118.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">室内が先、現地は後</text>
<path d="M426 107 L430 107" stroke="#000" stroke-width="1.9" fill="none"/><polygon points="438,107 428,102 428,112" fill="#000" stroke="#000" stroke-width="1.09"/>
<rect x="438" y="70" width="126" height="74" fill="none" stroke="#000" stroke-width="1.63"/><text x="501" y="102.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">読み取る</text><text x="501" y="118.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">数と図から事実を</text>
<path d="M564 107 L568 107" stroke="#000" stroke-width="1.9" fill="none"/><polygon points="576,107 566,102 566,112" fill="#000" stroke="#000" stroke-width="1.09"/>
<rect x="576" y="70" width="126" height="74" fill="none" stroke="#000" stroke-width="1.63"/><text x="639" y="102.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">まとめる</text><text x="639" y="118.96" font-size="11" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">事実と考えを分ける</text>
<path d="M501 144 L501 184" stroke="#000" stroke-width="1.63" fill="none" stroke-dasharray="6 4"/>
<path d="M501 184 L225 184" stroke="#000" stroke-width="1.63" fill="none" stroke-dasharray="6 4"/>
<path d="M225 184 L225 150" stroke="#000" stroke-width="1.63" fill="none" stroke-dasharray="6 4"/>
<polygon points="225,144 220,154 230,154" fill="#000" stroke="#000" stroke-width="1.09"/>
<text x="363" y="200" font-size="12" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">資料と合わなければ、仮説を立て直してもう一度</text>
<text x="24" y="258" font-size="12" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">合わなかったことも結果である。そのまま書き残しておく。</text>
<text x="20" y="290" font-size="10" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">※ この冊子のために作図した図です。</text>
