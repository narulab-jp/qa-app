<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="知りたいことと見る資料"><defs>
 <pattern id="pDiag" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><path d="M0 8 L8 0" stroke="#000" stroke-width="1.4"/></pattern>
 <pattern id="pDiag2" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><path d="M0 0 L8 8" stroke="#000" stroke-width="1.4"/></pattern>
 <pattern id="pDot" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/><circle cx="2" cy="2" r="1.3" fill="#000"/>
  <circle cx="6" cy="6" r="1.3" fill="#000"/></pattern>
 <pattern id="pDotFine" width="5" height="5" patternUnits="userSpaceOnUse">
  <rect width="5" height="5" fill="#fff"/><circle cx="1.4" cy="1.4" r="0.9" fill="#000"/></pattern>
 <pattern id="pGrid" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#fff"/>
  <path d="M0 4 H8 M4 0 V8" stroke="#000" stroke-width="0.9"/></pattern>
 <pattern id="pWave" width="10" height="8" patternUnits="userSpaceOnUse">
  <rect width="10" height="8" fill="#fff"/>
  <path d="M0 5 q2.5 -3 5 0 t5 0" stroke="#000" stroke-width="0.9" fill="none"/></pattern>
</defs><rect width="720" height="380" fill="#fff"/>
<text x="20" y="26" font-size="15" text-anchor="start" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">図2　知りたいことと、見る資料</text>
<rect x="24" y="62" width="672" height="44" fill="none" stroke="#000" stroke-width="1.3"/>
<text x="162" y="89" font-size="12.5" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">知りたいこと</text>
<text x="498" y="89" font-size="12.5" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">見る資料</text>
<rect x="24" y="106" width="672" height="44" fill="none" stroke="#000" stroke-width="0.9"/>
<text x="38" y="133" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">昔と今で何が変わったか</text>
<text x="314" y="133" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">旧版地形図と現在の地形図を同じ範囲で見比べる</text>
<rect x="24" y="150" width="672" height="44" fill="none" stroke="#000" stroke-width="0.9"/>
<text x="38" y="177" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">土地の成り立ち、水害の起こりやすさ</text>
<text x="314" y="177" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">土地条件図・治水地形分類図・ハザードマップ</text>
<rect x="24" y="194" width="672" height="44" fill="none" stroke="#000" stroke-width="0.9"/>
<text x="38" y="221" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">どこに何人住んでいるか</text>
<text x="314" y="221" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">国勢調査（e-Stat で町丁ごとに取れる）</text>
<rect x="24" y="238" width="672" height="44" fill="none" stroke="#000" stroke-width="0.9"/>
<text x="38" y="265" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">何をつくり、どこへ売っているか</text>
<text x="314" y="265" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">市町村の統計書・農林業センサス・貿易統計</text>
<rect x="24" y="282" width="672" height="44" fill="none" stroke="#000" stroke-width="0.9"/>
<text x="38" y="309" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">いつ、なぜそうしたのか</text>
<text x="314" y="309" font-size="12.5" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">その場にいた人への聞き取り</text>
<path d="M300 62 L300 326" stroke="#000" stroke-width="0.9" fill="none"/>
<text x="24" y="350" font-size="12" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">上の4つは室内で手に入る。いちばん下だけは、現地に行かないと取れない。</text>
<text x="20" y="370" font-size="10" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" fill="#000">※ この冊子のために作図した図です。</text>
</svg>
